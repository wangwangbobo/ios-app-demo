<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Lucia · 出行，不必慌张 — 可交互 App</title>
<meta name="description" content="Lucia 是一个原生 SwiftUI 旅行助手。这里是在浏览器里能点的版本：五个 Tab、可拖动的 Citywalk 点位、社区频道、拍照翻译和随叫随到的 AI 助手。">
<meta name="theme-color" content="#F4ECDC">
<link rel="icon" href="AppIcon-256.png">
<link rel="apple-touch-icon" href="AppIcon.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="stage">
  <aside class="side" aria-label="关于这个原型">
    <div class="side-sticker">PLAYABLE PROTOTYPE</div>
    <div class="brand">
      <span class="brand-mark">L</span>
      <span>LUCIA</span>
      <span class="brand-dot"></span>
    </div>
    <h2>把一趟北京<em>装进口袋。</em></h2>
    <p>这是 Lucia 的可交互版本：下面机身里不是截图，五个 Tab、路线点位、扫描识别和社区发布都能真的点。</p>
    <ul class="tips">
      <li><b>01</b><span>计划页点「调点位」，拖动编号圆点，路线会跟着重算。</span></li>
      <li><b>02</b><span>翻译页按快门，走完一次拍照扫描与识别的流程。</span></li>
      <li><b>03</b><span>社区 → 活动，发一场自己的 Citywalk 活动。</span></li>
    </ul>
    <div class="side-note">原生 SwiftUI 源码在 <a href="https://github.com/wangwangbobo/ios-app-demo/tree/main/Lucia" target="_blank" rel="noopener">Lucia/</a>，这里是把它的界面与流程搬进浏览器的版本。地图、社区、翻译均为本地演示数据。</div>
  </aside>

  <div class="device" id="device">
    <div class="notch" aria-hidden="true"></div>
    <div class="statusbar" aria-hidden="true">
      <span>16:43</span>
      <span class="sig" aria-hidden="true"><i></i><i></i><i></i><i></i><span style="margin-left:2px">5G</span></span>
      <span class="row" style="gap:5px">
        <svg width="13" height="10" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M1.5 4.2a9 9 0 0113 0M4 6.7a5.6 5.6 0 018 0M6.4 9.1a2.4 2.4 0 013.2 0"/></svg>
        <span class="battery" aria-hidden="true"></span>
      </span>
    </div>

    <div class="app" id="app">
      <main class="view" id="view" aria-live="polite"></main>

      <nav class="dock" id="dock" aria-label="主导航"></nav>
      <div class="toast" id="toast" role="status"></div>
      <div class="sheet-layer" id="sheetLayer" aria-modal="true" role="dialog"></div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
